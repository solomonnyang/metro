<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetroElectric · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0b1120;
      color: #e2e8f0;
      min-height: 100vh;
    }
    button { font-family: inherit; cursor: pointer; }
    input, select { font-family: inherit; }

    /* Login */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1000px 500px at 50% -10%, #172a5c 0%, #0b1120 60%);
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: #111a30;
      border: 1px solid #1f2c4a;
      border-radius: 18px;
      padding: 40px 34px;
      box-shadow: 0 30px 60px rgba(0,0,0,.5);
    }
    .login-card .logo { font-size: 44px; text-align: center; margin-bottom: 12px; }
    .login-card h1 { text-align: center; font-size: 22px; font-weight: 800; color: #fff; }
    .login-card p { text-align: center; color: #7c8db3; font-size: 13px; margin: 6px 0 28px; }
    .login-card label { display: block; color: #9aa9c9; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .login-card input {
      width: 100%;
      background: #0d1526;
      border: 1px solid #22314f;
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 18px;
      transition: border-color .15s;
    }
    .login-card input:focus { outline: none; border-color: #2aabee; }
    .login-card .btn {
      width: 100%;
      background: linear-gradient(90deg, #2aabee, #229ed9);
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      padding: 13px;
      border-radius: 10px;
      transition: opacity .15s;
    }
    .login-card .btn:disabled { opacity: .55; cursor: not-allowed; }
    .login-error { color: #f87171; font-size: 13px; margin-top: 12px; text-align: center; }

    /* Layout */
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar {
      background: #0e1629;
      border-right: 1px solid #1c2742;
      padding: 24px 18px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .sidebar .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; color: #fff; margin-bottom: 30px; }
    .sidebar .brand span { font-size: 22px; }
    .side-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 12px; border-radius: 10px; color: #8ea0c4;
      font-size: 14px; font-weight: 600; margin-bottom: 6px; width: 100%;
      background: none; border: none; text-align: left;
    }
    .side-item:hover { background: #152039; color: #dbe4f5; }
    .side-item.active { background: #1c2f57; color: #fff; }
    .sidebar .logout { margin-top: 20px; color: #f87171; }
    .main { padding: 28px 32px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
    .topbar h2 { font-size: 22px; font-weight: 800; color: #fff; }
    .topbar .sub { color: #7c8db3; font-size: 13px; margin-top: 3px; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 28px; }
    .stat-card {
      background: #111a30; border: 1px solid #1f2c4a; border-radius: 14px; padding: 18px;
    }
    .stat-card .ic { font-size: 20px; margin-bottom: 10px; }
    .stat-card .val { font-size: 26px; font-weight: 800; color: #fff; }
    .stat-card .lbl { font-size: 12px; color: #7c8db3; margin-top: 4px; font-weight: 500; }
    .stat-card .val.green { color: #34d399; }

    /* Panel */
    .panel { background: #111a30; border: 1px solid #1f2c4a; border-radius: 14px; overflow: hidden; }
    .panel-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid #1f2c4a; }
    .panel-head input {
      flex: 1; background: #0d1526; border: 1px solid #22314f; color: #fff;
      padding: 10px 14px; border-radius: 10px; font-size: 14px;
    }
    .panel-head input:focus { outline: none; border-color: #2aabee; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #18233c; white-space: nowrap; }
    th { color: #7c8db3; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
    tr:hover td { background: #141f38; }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700;
    }
    .badge.active { background: rgba(52,211,153,.14); color: #34d399; }
    .badge.inactive { background: rgba(248,113,113,.14); color: #f87171; }
    .btn-sm {
      background: none; border: none; color: #2aabee; font-size: 13px; font-weight: 600;
      padding: 6px 8px; border-radius: 8px;
    }
    .btn-sm:hover { background: #152039; }
    .btn-sm.danger { color: #f87171; }
    .btn-sm.success { color: #34d399; }

    .paging { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; color: #7c8db3; font-size: 13px; }
    .paging .btns button {
      background: #1c2f57; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 600;
      margin-left: 6px; font-size: 13px;
    }
    .paging .btns button:disabled { opacity: .4; cursor: not-allowed; }

    /* Modal */
    .overlay {
      position: fixed; inset: 0; background: rgba(4,8,18,.72); display: flex;
      align-items: center; justify-content: center; padding: 24px; z-index: 40;
    }
    .modal {
      width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto;
      background: #111a30; border: 1px solid #22314f; border-radius: 16px; padding: 24px;
    }
    .modal h3 { color: #fff; font-size: 18px; font-weight: 800; margin-bottom: 4px; }
    .modal .idline { color: #7c8db3; font-size: 12px; margin-bottom: 18px; }
    .modal .close { float: right; background: none; border: none; color: #7c8db3; font-size: 20px; }
    .kv { display: grid; grid-template-columns: 150px 1fr; gap: 8px 12px; font-size: 13px; margin-bottom: 6px; }
    .kv b { color: #7c8db3; font-weight: 600; }
    .kv span { color: #e2e8f0; }
    .mod-col { margin-bottom: 20px; }
    .mod-col h4 { color: #b9c7e8; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
    .mini-table td, .mini-table th { padding: 8px 10px; font-size: 12.5px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button {
      flex: 1; padding: 11px; border-radius: 10px; font-weight: 700; font-size: 14px; border: none;
    }
    .btn-accent { background: linear-gradient(90deg,#2aabee,#229ed9); color: #fff; }
    .btn-outline { background: none; color: #7c8db3; border: 1px solid #22314f !important; }
    .btn-danger { background: rgba(248,113,113,.15); color: #f87171; border: 1px solid rgba(248,113,113,.3) !important; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #1c2f57; color: #fff;
      padding: 12px 18px; border-radius: 10px; font-size: 14px; font-weight: 600;
      box-shadow: 0 12px 30px rgba(0,0,0,.4);
    }
    .loading { text-align: center; padding: 40px; color: #7c8db3; }
    .empty { text-align: center; padding: 40px; color: #7c8db3; font-size: 14px; }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; }
      .main { padding: 20px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="./admin.js"></script>
</body>
</html>
